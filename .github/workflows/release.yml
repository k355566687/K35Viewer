# 配布物を作り、GitHub のリリース（下書き）に添付する（開発環境設計書 17.2・18章）。
# ・タグ（v0.2.0 など）を push すると動く。タグとアプリのバージョン（K35Viewer.App.csproj の Version）が違えば失敗する
# ・リリースは下書きで作る。リリースノートを確かめてから、GitHub の画面で公開する
# ・配布物（ZIP）と、そのハッシュ（SHA-256。.sha256）を添付する。アプリの更新が、ハッシュで配布物を確かめる
# ・手動で実行（workflow_dispatch）した場合は、配布物を作って成果物（Artifacts）に置くだけで、リリースは作らない（確認用）
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/K35Viewer.App/K35Viewer.App.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw "K35Viewer.App.csproj に Version がありません" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "タグ（$env:GITHUB_REF_NAME）と、アプリのバージョン（v$version）が違います。K35Viewer.App.csproj の Version を合わせてください"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=K35Viewer-v$version-win-x64.zip" >> $env:GITHUB_OUTPUT
          "hash=K35Viewer-v$version-win-x64.zip.sha256" >> $env:GITHUB_OUTPUT

      # テストを実行してから、self-contained x64 のフォルダを作る（テストが失敗すれば、配布物を作らない）
      - name: Test and publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/K35Viewer-win-x64 -DestinationPath "${{ steps.version.outputs.asset }}" -CompressionLevel Optimal

      # アプリの更新（設定画面の「更新する」）が、ダウンロードした配布物を確かめるためのハッシュ（SHA-256）。
      # 「〈ハッシュ〉  〈ファイル名〉」の1行（sha256sum と同じ形）。配布物と同じリリースに添付する（要件定義 24.6）
      - name: Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ steps.version.outputs.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "${{ steps.version.outputs.hash }}" -Value "$hash  ${{ steps.version.outputs.asset }}" -Encoding ascii
          Get-Content "${{ steps.version.outputs.hash }}"
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.asset }}
          path: |
            ${{ steps.version.outputs.asset }}
            ${{ steps.version.outputs.hash }}

      # 1.0 より前の版は、試用版（Pre-release）として作る
      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 版ごとの紹介（.github/release-notes/<タグ>.md。あれば）、定型の部分（ダウンロード、アンインストール、Code signing policy、プライバシー）、
          # 自動生成の変更点、の順に並ぶ
          $notes = '.github/release-notes.md'
          $specific = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          if (Test-Path $specific) {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            $combined = (Get-Content $specific -Raw -Encoding utf8) + "`n" + (Get-Content '.github/release-notes.md' -Raw -Encoding utf8)
            [System.IO.File]::WriteAllText($notes, $combined, [System.Text.UTF8Encoding]::new($false))
          }
          $options = @('--draft', '--generate-notes', '--notes-file', $notes, '--title', "35Viewer $env:GITHUB_REF_NAME")
          if ('${{ steps.version.outputs.version }}'.StartsWith('0.')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME "${{ steps.version.outputs.asset }}" "${{ steps.version.outputs.hash }}" @options
